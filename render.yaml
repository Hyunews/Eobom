# Render Blueprint — 이어봄 백엔드 배포
# 사용법: Render 대시보드 > New > Blueprint > 이 레포 선택 → 자동 인식됨.
# sync: false로 표시된 값은 Blueprint 생성 화면에서 직접 입력해야 함(레포에는 시크릿을 넣지 않음).
#
# name을 eobom-backend로 고정해서 배포 도메인이 https://eobom-backend.onrender.com 으로
# 예측 가능하게 만들었다 — 그래야 카카오/네이버/구글 콜백 URL을 배포 전에 미리 등록할 수 있다.

services:
  - name: eobom-backend
    type: web
    runtime: node
    plan: free
    rootDir: eobom/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # 2026-08-20 — DB는 Render Postgres가 아니라 Supabase(서울 리전)를 쓴다.
      # 무료 Render Postgres는 백업이 없고 수명 제한이 있어 프로덕션 부적합(00-11 §4.1).
      # 아래 두 값은 Supabase 대시보드 > Connect 에서 복사해 Render 대시보드에 직접 넣는다.
      #   DATABASE_URL : 런타임용(커넥션 풀러)
      #   DIRECT_URL   : 마이그레이션용(직결) — 없으면 `prisma migrate deploy`가 실패한다
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://eobom.vercel.app
      - key: JWT_SECRET
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/kakao/callback
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/naver/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/google/callback

# databases: 블록 제거(2026-08-20) — Render Postgres를 만들지 않는다.
# Blueprint를 만드는 순간 무료 Postgres 30일 수명 시계가 도는데, 쓰지도 않을 DB다.
# DB는 Supabase(서울 리전, 00-17 §3.3 "논점을 만들지 않는다")를 쓴다.
