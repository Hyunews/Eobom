# Render Blueprint — 이어봄 백엔드 배포
# 사용법: Render 대시보드 > New > Blueprint > 이 레포 선택 → 자동 인식됨.
# sync: false로 표시된 값은 Blueprint 생성 화면에서 직접 입력해야 함(레포에는 시크릿을 넣지 않음).
#
# name을 eobom-backend로 고정해서 배포 도메인이 https://eobom-backend.onrender.com 으로
# 예측 가능하게 만들었다 — 그래야 카카오/네이버/구글 콜백 URL을 배포 전에 미리 등록할 수 있다.

# 🔴 region: 을 적지 않으면 조용히 oregon(미국)이 되고, 생성 후에는 바꿀 수 없다(서비스 재생성 필요).
# 2026-08-21 실측: 백엔드 oregon ↔ DB 서울이라 DB를 타는 API가 ~1,500ms(미사용 API는 ~165ms).
# 성능보다 큰 문제는 **개인정보가 미국에서 처리된다**는 것 — Supabase를 서울로 잡은 이유
# (00-17 §3.3 "논점 자체를 만들지 않는다")가 무효가 된다.
# 🔵 개발자 판단(08-21): **싱가포르로 옮기지 않는다** — 지연만 줄고 국외이전은 그대로다.
#    국내 서버로 전환할 때 region을 그에 맞춰 한 번에 정한다(→ pending-approvals.md 인프라 항목).
services:
  - name: eobom-backend
    type: web
    runtime: node
    plan: free
    rootDir: eobom/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      # 2026-08-20 — DB는 Render Postgres가 아니라 Supabase(서울 리전)를 쓴다.
      # 무료 Render Postgres는 백업이 없고 수명 제한이 있어 프로덕션 부적합(00-11 §4.1).
      # 아래 두 값은 Supabase 대시보드 > Connect 에서 복사해 Render 대시보드에 직접 넣는다.
      #   DATABASE_URL : 런타임용(커넥션 풀러)
      #   DIRECT_URL   : 마이그레이션용(직결) — 없으면 `prisma migrate deploy`가 실패한다
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        value: https://eobom.vercel.app
      - key: JWT_SECRET
        sync: false
      # 🔴 로컬 .env와 **다른 값**을 쓴다(2026-08-27 교체). 같으면 로컬 .env 유출이 곧 운영 데이터
      # 유출이다 — 운영 덤프를 로컬에서 복호화할 수 없는 것이 security.md §1(운영 개인정보를
      # 로컬로 가져오지 않는다)을 기술적으로 강제한다.
      # utils/crypto.ts(AES-256-GCM)가 이 키로 정산 계좌·조의금 계좌를 암호화한다.
      # 옛 주석의 "Obituary.accountNumberEnc 실제 데이터 1건"은 08-27 키 교체 후 정리되어 0건이다.
      # (2026-08-20 추가: 이 항목이 빠져 있어 배포 시 계좌 기능이 죽을 뻔했다)
      - key: SETTLEMENT_ENCRYPTION_KEY
        sync: false
      # 06(엔딩노트·유족 메시지) 전용 키(06-04 §13 #4) — 정산 계좌 키와 분리. 로컬과 다른 값을 쓴다.
      # 🔴 운영 키를 잃으면 유언·편지를 영영 복호화할 수 없다.
      - key: ENDING_NOTE_ENCRYPTION_KEY
        sync: false
      - key: KAKAO_CLIENT_ID
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/kakao/callback
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/naver/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://eobom-backend.onrender.com/api/auth/google/callback
      # 06-04 §6.4-11 NCP CLOVA Speech(STT 파일 업로드). 2026-08-26 — 개발 중엔 로컬 .env에만
      # 넣어뒀다가 배포본에 등록을 빠뜨려 한 번 false로 남았던 적이 있다. Blueprint 재생성 시
      # 반드시 셋 다 채울 것.
      - key: CLOVA_STT_ENABLED
        sync: false
      - key: CLOVA_SPEECH_INVOKE_URL
        sync: false
      - key: CLOVA_SPEECH_SECRET
        sync: false

# databases: 블록 제거(2026-08-20) — Render Postgres를 만들지 않는다.
# Blueprint를 만드는 순간 무료 Postgres 30일 수명 시계가 도는데, 쓰지도 않을 DB다.
# DB는 Supabase(서울 리전, 00-17 §3.3 "논점을 만들지 않는다")를 쓴다.
